<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Jacob Fessler</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <script>
    (function () {
      var d = document.documentElement, t;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      d.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === "dark" ? "#0a0a0a" : "#ffffff";
    })();
  </script>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" sizes="any">
  <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180">
  <link rel="preload" href="/fonts/Aileron-Regular.otf" as="font" type="font/otf" crossorigin>
